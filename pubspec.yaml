name: sort_dart_members
description: >
  A command line tool for sorting members in Dart files.
  Mimics official Dart LSP behavior.
# If you change this, also change the version in bin/sort_dart_members.dart.
version: 0.1.1
repository: https://github.com/filiph/sort_dart_members

environment:
  sdk: ^3.13.4

executables:
  sortdart: sort_dart_members

# Add regular dependencies here.
dependencies:
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17
  args: ^2.7.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.25.6
  test_descriptor: ^2.0.1
  test_process: ^2.1.0
